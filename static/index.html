<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Support Desk</title>
<style>
:root{--bg:#f4f7fb;--ink:#172b4d;--mute:#718096;--line:#e5eaf2;--soft:#f8faff;--acc:#2563eb;--bad:#dc3545;--ok:#159568;--card:#fff;--shadow:0 4px 18px rgba(30,55,90,.06)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;gap:24px;align-items:center;padding:0 28px;border-bottom:1px solid var(--line);height:64px;background:#fff;box-shadow:0 2px 8px rgba(30,55,90,.03)}header b{font-size:18px;font-weight:700;color:#1e3a5f}
nav button{background:none;border:0;padding:21px 8px;margin-right:14px;color:var(--mute);font:600 13px/1.4 "Segoe UI",sans-serif;cursor:pointer;border-bottom:3px solid transparent}nav button.on{color:var(--acc);border-color:var(--acc)}
main{padding:30px;max-width:1400px;margin:auto}h2{font-size:21px;font-weight:700;margin:0 0 18px;color:var(--ink)}.row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;min-width:180px;flex:1;box-shadow:var(--shadow)}.stat span{display:block;color:var(--mute);font-size:13px;font-weight:500;margin-bottom:8px}.stat b{font-size:28px;font-weight:700;color:var(--ink)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line)}th{color:#52647d;font-size:12px;font-weight:700;background:#f1f5fb;text-transform:uppercase;letter-spacing:.4px}td{font-size:13px}tr:last-child td{border-bottom:0}tr.c{cursor:pointer}tr.c:hover{background:#f2f6ff}
input,select,textarea,button.p{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:2px solid rgba(37,99,235,.12)}button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;cursor:pointer;padding:9px 16px}button.p:hover{background:#1d4ed8}button:disabled{opacity:.45;cursor:not-allowed}
.tag{padding:4px 10px;border-radius:20px;background:#edf2f8;color:#40536d;font-size:12px;font-weight:600}.bad{color:var(--bad)}.ok{color:var(--ok)}.msg{border-left:3px solid var(--acc);background:#f8faff;padding:10px 14px;margin:10px 0;border-radius:0 8px 8px 0}.msg small{color:var(--mute)}
#toast{position:fixed;bottom:20px;right:20px;background:#172b4d;color:#fff;padding:12px 18px;border-radius:9px;display:none;box-shadow:var(--shadow);z-index:10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.grid>div{background:var(--card);padding:20px;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.grid h2{font-size:16px;margin-bottom:14px}
label{display:block;margin:12px 0 5px;color:var(--mute);font-weight:600}
@media(max-width:800px){main{padding:18px}.grid{grid-template-columns:1fr}header{padding:0 14px;gap:10px}nav button{margin-right:5px;padding:20px 5px}.stat{min-width:140px}}
</style></head><body>
<header><b>Campus Support Desk</b><nav id="nav"></nav></header><main id="m"></main><div id="toast" role="status"></div>
<script>
let TOKEN=null,ME=null;const $=s=>document.querySelector(s),api=async(u,o)=>{const r=await fetch(u,{method:o?'POST':'GET',headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:o?JSON.stringify(o):undefined});const j=await r.json();if(!r.ok)throw Error(j.error);return j};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tabs={dashboard:'Dashboard',tickets:'Tickets',new:'New request'};let tab='dashboard',filt={status:'',domain:'',priority:'',q:'',offset:0};
const renderNav=()=>{const t={...(ME.staff?tabs:{tickets:'Tickets',new:'New request'})};if(ME.role.includes('admin'))t.audit='Audit';$('#nav').innerHTML=Object.entries(t).map(([k,v])=>`<button data-t="${k}">${v}</button>`).join('')+`<button id="lo">Sign out (${ME.requester_id}, ${ME.role})</button>`};
$('#nav').onclick=e=>{if(e.target.id=='lo'){TOKEN=ME=null;go('login')}else if(e.target.dataset.t)go(e.target.dataset.t)};
async function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('#m').innerHTML='Loading…';try{await views[t]()}catch(e){$('#m').innerHTML=`<p class="bad">${esc(e.message)}</p>`}}
const views={
async dashboard(){const d=await api('/api/metrics');$('#m').innerHTML=`<h2>Overview</h2><div class="row"><div class="stat"><span>Tickets</span><b>${d.total}</b></div><div class="stat"><span>SLA breach rate</span><b>${(d.sla_breach_rate*100).toFixed(1)}%</b></div><div class="stat"><span>Escalation rate</span><b>${(d.escalation_rate*100).toFixed(1)}%</b></div><div class="stat"><span>Average rating</span><b>${d.avg_rating}</b></div></div>
<div class="grid"><div><h2>By status</h2><table>${d.by_status.map(r=>`<tr><td>${r.status}</td><td>${r.n}</td></tr>`).join('')}</table></div><div><h2>By domain</h2><table>${d.by_domain.map(r=>`<tr><td>${r.domain}</td><td>${r.n}</td></tr>`).join('')}</table></div></div>`},
async tickets(){const qs=new URLSearchParams({...filt,limit:25});const d=await api('/api/tickets?'+qs);const sel=(k,o)=>`<select data-f="${k}"><option value="">${k}: all</option>${o.map(x=>`<option ${filt[k]==x?'selected':''}>${x}</option>`)}</select>`;
$('#m').innerHTML=`<h2>Tickets (${d.total})</h2><div class="row"><input data-f="q" placeholder="Search subject or ID" value="${esc(filt.q)}">${sel('status',['open','in_progress','escalated','resolved','closed'])}${sel('domain',['FIN','REG','IT','ACC'])}${sel('priority',['urgent','high','normal'])}</div>
${d.items.length?`<table><tr><th>ID</th><th>Subject</th><th>Domain</th><th>Priority</th><th>Status</th><th>SLA due</th></tr>${d.items.map(t=>`<tr class="c" data-id="${t.ticket_id}"><td>${t.ticket_id}</td><td>${esc(t.subject)}</td><td>${t.domain}</td><td>${t.priority}</td><td><span class="tag">${t.status}</span></td><td class="${t.breached?'bad':''}">${t.due_at}</td></tr>`).join('')}</table>`:'<p>No tickets match these filters.</p>'}
<div class="row" style="margin-top:12px"><button class="p" id="pv" ${filt.offset?'':'disabled'}>Previous</button><button class="p" id="nx" ${filt.offset+25<d.total?'':'disabled'}>Next</button></div>`;
document.querySelectorAll('[data-f]').forEach(e=>e.onchange=()=>{filt[e.dataset.f]=e.value;filt.offset=0;views.tickets()});$('#pv').onclick=()=>{filt.offset-=25;views.tickets()};$('#nx').onclick=()=>{filt.offset+=25;views.tickets()};
document.querySelectorAll('tr.c').forEach(r=>r.onclick=()=>views.detail(r.dataset.id))},
async detail(id){const d=await api('/api/tickets/'+id),t=d.ticket;$('#m').innerHTML=`<p><a href="#" id="bk">Back to tickets</a></p><h2>${t.ticket_id}: ${esc(t.subject)}</h2><div class="row"><span class="tag">${t.status}</span><span class="tag">${t.priority}</span><span class="tag">${t.category}</span><span class="tag ${d.sla.breached?'bad':''}">due ${d.sla.due_at}</span></div>
<div class="grid"><div><h2>Conversation</h2>${d.messages.map(m=>`<div class="msg"><small>${m.sender_type} · ${m.sent_at}${m.citations?' · source '+m.citations:''}</small><div>${esc(m.body)}</div></div>`).join('')}</div>
<div><h2>History</h2><table>${d.events.map(e=>`<tr><td>${e.event_type}</td><td>${e.event_at}</td></tr>`).join('')}</table><h2 style="margin-top:16px">Routing</h2><table>${d.assignments.map(a=>`<tr><td>${a.team_id}</td><td>${a.reason}</td></tr>`).join('')}</table>
${!['resolved','closed'].includes(t.status)?`<h2 style="margin-top:16px">Resolve</h2><label for="rt">Rating</label><select id="rt"><option value="">No rating</option>${[5,4,3,2,1].map(x=>`<option>${x}</option>`)}</select> <button class="p" id="rs">Mark resolved</button>`:`<p class="ok">Resolved ${t.resolved_at}${d.feedback[0]?' · rating '+d.feedback[0].rating:''}</p>`}</div></div>`;
$('#bk').onclick=e=>{e.preventDefault();go('tickets')};const b=$('#rs');if(b)b.onclick=async()=>{try{const v=$('#rt').value;await api(`/api/tickets/${id}/resolve`,{rating:v?+v:null});toast('Ticket resolved');views.detail(id)}catch(e){toast(e.message)}}},
async new(){const l=await api('/api/lookups');$('#m').innerHTML=`<h2>New request</h2><div style="max-width:520px"><label for="rq">Requester</label><select id="rq">${l.requesters.map(r=>`<option value="${r.requester_id}">${r.requester_id} ${r.full_name}</option>`)}</select><label for="ct">Category</label><select id="ct">${l.categories.map(c=>`<option value="${c.category_id}">${c.domain}: ${c.name}</option>`)}</select><label for="pr">Priority</label><select id="pr"><option>normal</option><option>high</option><option>urgent</option></select><label for="sj">Subject</label><input id="sj" style="width:100%"><label for="bd">Details</label><textarea id="bd" rows="4" style="width:100%"></textarea><p><button class="p" id="sv">Submit request</button></p></div>`;
$('#sv').onclick=async()=>{try{const r=await api('/api/tickets',{requester_id:$('#rq').value,category_id:$('#ct').value,priority:$('#pr').value,subject:$('#sj').value,body:$('#bd').value});toast(`${r.ticket_id} created${r.escalated?' and escalated: no matching current policy':''}`);views.detail(r.ticket_id)}catch(e){toast(e.message)}}},
async audit(){const d=await api('/api/audit');$('#m').innerHTML=`<h2>Rule-based audit vs. labelled ground truth</h2><table><tr><th>Check</th><th>Detected</th><th>Ground truth</th><th>Precision</th><th>Recall</th></tr>${Object.entries(d).map(([k,v])=>`<tr><td>${k}</td><td>${v.detected}</td><td>${v.ground_truth}</td><td>${v.precision??'-'}</td><td>${v.recall??'-'}</td></tr>`).join('')}</table>`}};
views.login=async()=>{const u=await api('/api/login-users');$('#nav').innerHTML='';$('#m').innerHTML=`<h2>Sign in</h2><div style="max-width:420px"><label for="lu">User</label><select id="lu">${u.map(x=>`<option value="${x.requester_id}">${x.requester_id} (${x.role})</option>`).join('')}</select><label for="lp">Password</label><input id="lp" type="password" style="width:100%"><p><button class="p" id="li">Sign in</button></p></div>`;$('#li').onclick=async()=>{try{const r=await api('/api/login',{requester_id:$('#lu').value,password:$('#lp').value});TOKEN=r.token;ME=r;renderNav();go(r.staff?'dashboard':'tickets')}catch(e){toast(e.message)}}};
go('login');
</script></body></html>
